<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Builder - Inventario</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="cuerpo_inicio">
    <header class="cabecera-global">
        <div>
            <a href="index.html" class="cabecera_titulo">PC Builder</a>
            <span class="cabecera_lema">Arma tu PC Ideal</span>
        </div>
        <nav>
            <ul class="menu_lista">
                <li><a class="menu_enlace" href="#contacto" style="color: white;">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <aside class="menu-lateral">
        <div class="grupo">
            <h2 class="grupo_titulo">Filtros</h2>
            <div id="contenedor-filtros" style="display:flex; flex-direction:column; gap:8px; margin-top: 10px;">
            </div>
        </div>
        <div class="grupo">
            <h2 class="grupo_titulo">Resumen del Sistema</h2>
            <ul id="lista-resumen" class="tarjeta_lista">
            </ul>
        </div>
    </aside>

    <main>

<section class="seccion_inicio">
            <h2 class="seccion_titulo">Inventario por capas</h2>

            <form id="formulario" class="formulario" autocomplete="off">
   
                <div class="campo" style="display: none;">
                    <label class="campo_etiqueta" for="id">ID:</label>
                    <input type="text" id="id" class="campo_control" placeholder="ID" readonly>
                </div>
                
                <div class="campo">
                    <label class="campo_etiqueta" for="nombre">Nombre:</label>
                    <input type="text" id="nombre" class="campo_control" placeholder="Nombre">
                </div>
                
                <div class="campo">
                    <label class="campo_etiqueta" for="categoria">Categoría:</label>
                    <input type="text" id="categoria" class="campo_control" placeholder="Categoría">
                </div>
                
                <div class="campo">
                    <label class="campo_etiqueta" for="precio">Precio (COP):</label>
                    <input type="number" id="precio" class="campo_control" placeholder="Precio">
                </div>
                
                <div class="campo">
                    <label class="campo_etiqueta" for="stock">Stock:</label>
                    <input type="number" id="stock" class="campo_control" placeholder="Stock">
                </div>
                
                <div class="formulario_acciones">
                    <button type="submit" id="guardar" class="boton">Agregar</button>
                    <button type="button" id="cancelar" class="boton boton--secundario" hidden>Cancelar</button>
                </div>
            </form>
            
            <p id="mensaje" aria-live="polite" style="margin-bottom: 20px; font-weight: 600;"></p>

            <div class="tabla-contenedor">
                <table class="tabla">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo"></tbody>
                </table>
            </div>
            
            <p id="resumen" style="margin-top: 15px; font-weight: 600; color: var(--color-texto-tenue);"></p>
        </section>



        <section id="contacto" class="seccion_inicio">
            <h2 class="seccion_titulo">Contacto</h2>
            <form id="form-contacto" class="formulario">
                <div class="campo">
                    <label class="campo_etiqueta" for="contacto-nombre">Nombre completo:</label>
                    <input type="text" id="contacto-nombre" class="campo_control" required minlength="3"
                        pattern="[A-Za-z\s]+" title="Solo letras">
                </div>
                <div class="campo">
                    <label class="campo_etiqueta" for="contacto-correo">Correo Electrónico:</label>
                    <input type="email" id="contacto-correo" class="campo_control" required>
                </div>
                <p id="mensaje-exito" class="oculto exito-texto"></p>
                <div class="formulario_acciones">
                    <button type="submit" class="boton">Enviar Mensaje</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p class="footer_texto">© 2026 PC Builder. <a href="#" class="Contacto">Soporte</a></p>
        <p class="footer_texto--tenue">Todos los derechos reservados.</p>
    </footer>

    <script src="js/modelo.js"></script>
    <script src="js/vista.js"></script>
    <script src="js/controlador.js"></script>
</body>

</html>
