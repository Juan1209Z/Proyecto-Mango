<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Builder - Guias</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="cabecera-global">
        <div>
            <a href="index.html" class="cabecera_titulo">PC Builder</a>
            <span class="cabecera_lema">Arma tu PC Ideal</span>
        </div>
    </header>
<main class="contenedor-centrado" style="flex-direction: column; justify-content: flex-start; padding-top: 50px;">
    <h2 class="seccion_titulo">Requisitos por Juego</h2>
    <div class="campo" style="display: flex; gap: 10px; width: 100%; max-width: 600px;">
        <input type="text" id="input-juego" class="campo_control" placeholder="Ej: Cyberpunk 2077...">
        <button id="btn-buscar-juego" class="boton">Buscar</button>
    </div>

    <!-- Indicador de carga y mensajes de error -->
    <p id="estado-busqueda" class="campo_ayuda oculto" aria-live="polite" style="margin-top: 10px; font-weight: 600;"></p>
    
    <!-- Aquí se pintarán los resultados -->
    <div id="resultados-juego" class="catalogo" style="margin-top: 20px; width: 100%; max-width: 800px;"></div>
</main>

<script src="js/modelo.js"></script>
    <script src="js/vista.js"></script>
    <script type="module" src="js/controlador.js"></script>
</body>
</body>
