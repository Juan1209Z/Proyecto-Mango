<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Builder - Guias</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="cabecera-global">
        <div>
            <a href="index.html" class="cabecera_titulo">PC Builder</a>
            <span class="cabecera_lema">Arma tu PC Ideal</span>
        </div>
    </header>
    
    <main class="contenedor-centrado contenedor-centrado--top">
        <h2 class="seccion_titulo">Requisitos por Juego</h2>
        
        <div class="campo buscador-grupo">
            <input type="text" id="input-juego" class="campo_control" placeholder="Ej: Cyberpunk 2077...">
            <button id="btn-buscar-juego" class="boton">Buscar</button>
        </div>

        <p id="estado-busqueda" class="campo_ayuda oculto" aria-live="polite"></p>
        <div id="resultados-juego" class="catalogo"></div>
    </main>

    <script src="js/modelo.js"></script>
    <script src="js/vista.js"></script>
    <script type="module" src="js/controlador.js"></script>
</body>
</html>
